name: 3D Visualization Website Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      enable_ai_analysis:
        description: "Enable AI Screenshot Analysis"
        required: false
        default: false
        type: boolean
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      CI: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ENABLE_AI_ANALYSIS: ${{ inputs.enable_ai_analysis || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create test results directory
        run: mkdir -p test-results

      - name: Check and remove existing snapshots
        run: |
          echo "Cleaning up existing snapshots..."
          # Remove snapshots from tests directory
          if [ -d "tests" ]; then
            find tests -name "*-snapshots" -type d -exec rm -rf {} + 2>/dev/null || true
            echo "Cleaned snapshots from tests/ directory"
          fi
          # Remove snapshots from test file locations (Playwright default)
          find . -name "*-snapshots" -type d -not -path "./node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          # Remove test results
          if [ -d "test-results" ]; then
            rm -rf test-results/*
            echo "Cleaned test-results/ directory"
          fi
          echo "Snapshot cleanup complete"

      - name: Generate baseline snapshots
        run: npx playwright test --reporter=line
        env:
          FORCE_BASELINE_CREATION: true

      - name: Run Playwright tests
        run: npx playwright test --reporter=html,line

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: Clean snapshots → Generate baselines → Run tests" >> $GITHUB_STEP_SUMMARY
          echo "- CI Mode: Element screenshots only" >> $GITHUB_STEP_SUMMARY
          echo "- Browser: Chromium only" >> $GITHUB_STEP_SUMMARY
          echo "- AI Analysis: ${{ env.ENABLE_AI_ANALYSIS }}" >> $GITHUB_STEP_SUMMARY
          echo "- Baseline Generation: Fresh snapshots created with --update-snapshots" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

name: 3D Visualization Website Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      enable_ai_analysis:
        description: "Enable AI Screenshot Analysis"
        required: false
        default: false
        type: boolean
      ai_provider:
        description: "AI Provider"
        required: false
        default: "claude"
        type: choice
        options:
          - claude
          - openai
      ai_model:
        description: "AI Model"
        required: false
        default: "claude-3-5-haiku-latest"
        type: choice
        options:
          - claude-opus-4-20250514
          - claude-sonnet-4-20250514
          - claude-3-5-sonnet-latest
          - claude-3-5-haiku-latest
          - gpt-4o
          - gpt-4o-mini
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      CI: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      ENABLE_AI_ANALYSIS: ${{ inputs.enable_ai_analysis || 'false' }}
      AI_PROVIDER: ${{ inputs.ai_provider || 'claude' }}
      AI_MODEL: ${{ inputs.ai_model || 'claude-3-5-haiku-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests first time to create snapshots (expected to fail)
        run: npx playwright test --reporter=line
        continue-on-error: true

      - name: Run tests second time to validate snapshots
        run: npx playwright test --reporter=html,line

      - name: Upload generated snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-snapshots-${{ github.run_number }}
          path: |
            tests/**/*-snapshots/
            test-results/**/*.png
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: First run (creates snapshots) → Second run (validates)" >> $GITHUB_STEP_SUMMARY
          echo "- CI Mode: Element screenshots only" >> $GITHUB_STEP_SUMMARY
          echo "- Browser: Chromium only" >> $GITHUB_STEP_SUMMARY
          echo "- AI Analysis: ${{ env.ENABLE_AI_ANALYSIS }}" >> $GITHUB_STEP_SUMMARY
          echo "- AI Provider: ${{ env.AI_PROVIDER }}" >> $GITHUB_STEP_SUMMARY
          echo "- AI Model: ${{ env.AI_MODEL }}" >> $GITHUB_STEP_SUMMARY
          echo "- First run expected to fail (no baselines), second run should pass" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7
